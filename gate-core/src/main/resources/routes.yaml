# エンドポイントとDBのカラムを紐づけるやつ
# 書き方:
#   - path:    エンドポイントの URL パス
#     table:   クエリ対象の DB テーブル名
#     columns: 返すカラムのリスト
#     cache:   (必須) キャッシュ TTL。<数値><単位 s|m|h> 例: 30s / 5m / 1h
#              ※ cache を書かないルートは設定漏れとしてスキップされる
# → GET {path} が自動的に "SELECT {columns} FROM {table}" を実行し JSON 配列で返す
# 管理画面の「キャッシュクリア」で全 cache ルートは即時更新される。

routes:
  - path: /api/locations
    table: locations
    columns: [id, name, floor, location_code, svg_id, x, y]
    cache: 5m

  - path: /api/categories
    table: categories
    columns: [id, name]
    cache: 5m

  - path: /api/projects
    table: projects
    columns: [id, title, organizer, description, image_url, location_id]
    cache: 5m

  - path: /api/credit
    table: credit
    columns: [id, name]
    cache: 1h

  - path: /api/bus
    table: bus
    columns: [id,bus_id,School,School_Platform,Shinsapporo,Shinsapporo_Platform,Ooyati,Atubetu,Ooasa]
    cache: 15m