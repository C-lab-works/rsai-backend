name: Setup debug infra (one-time)

# 初回のみ手動実行。nginx + certbot のセットアップを行う。
# 2回目以降は nginx config の更新・リロードのみ行う。
on:
  workflow_dispatch:

jobs:
  setup-conoha-nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          args: --ephemeral

      - name: Render nginx config (substitute Tailscale IP)
        env:
          TATSUNOTE2_TS_HOST: ${{ secrets.TATSUNOTE2_TAILSCALE_HOST }}
        run: |
          envsubst '${TATSUNOTE2_TS_HOST}' \
            < deploy/nginx/debugv2.tatsut.jp.conf.tmpl \
            > /tmp/debugv2.tatsut.jp.conf
          echo "=== Rendered config ===" && cat /tmp/debugv2.tatsut.jp.conf

      - name: Upload nginx config & setup SSL on conoha
        env:
          CONOHA_HOST: ${{ secrets.CONOHA_TAILSCALE_HOST }}
        run: |
          # nginx config をアップロード (ssh経由でcat)
          ssh -o StrictHostKeyChecking=no "root@${CONOHA_HOST}" \
            "cat > /etc/nginx/sites-available/debugv2.tatsut.jp" \
            < /tmp/debugv2.tatsut.jp.conf

          ssh -o StrictHostKeyChecking=no "root@${CONOHA_HOST}" "
            set -e

            # ── nginx インストール (未インストールの場合) ──
            if ! command -v nginx &>/dev/null; then
              echo '=== Installing nginx ==='
              apt-get update -q && apt-get install -y nginx
            fi

            # ── certbot インストール (未インストールの場合) ──
            if ! command -v certbot &>/dev/null; then
              echo '=== Installing certbot ==='
              apt-get install -y certbot python3-certbot-nginx
            fi

            # ── 証明書が未取得の場合: 一時的なHTTP-only設定で取得 ──
            if [ ! -d /etc/letsencrypt/live/debugv2.tatsut.jp ]; then
              echo '=== Getting SSL cert (first time) ==='

              # 一時的にHTTP-onlyの設定を置いてcertbot acme challengeを通す
              cat > /etc/nginx/sites-available/debugv2.tatsut.jp << 'TMPCONF'
              server {
                  listen 80;
                  server_name debugv2.tatsut.jp;
                  root /var/www/html;
              }
          TMPCONF

              ln -sf /etc/nginx/sites-available/debugv2.tatsut.jp \
                     /etc/nginx/sites-enabled/debugv2.tatsut.jp
              nginx -t && systemctl reload nginx

              # 証明書取得 (standalone challengeではなくwebroot)
              certbot certonly --nginx \
                -d debugv2.tatsut.jp \
                --non-interactive \
                --agree-tos \
                -m claude@tatsut.jp

              echo '=== SSL cert obtained ==='
            else
              echo '=== SSL cert already exists, skipping certbot ==='
            fi

            # ── 最終的なSSL設定を適用 ──
            # (証明書取得後にアップロード済みの設定を有効化)
            ln -sf /etc/nginx/sites-available/debugv2.tatsut.jp \
                   /etc/nginx/sites-enabled/debugv2.tatsut.jp

            nginx -t
            systemctl reload nginx
            echo '=== nginx reloaded ==='

            # ── certbot 自動更新タイマー確認 ──
            systemctl is-enabled certbot.timer 2>/dev/null || \
              systemctl enable --now certbot.timer 2>/dev/null || \
              echo 'Note: certbot.timer not available, add cron manually'

            echo '=== Setup complete ==='
            nginx -v
            systemctl status nginx --no-pager -l | tail -5
          "
