name: Deploy

on:
  push:
    branches: [master, debug]
  workflow_dispatch:
    inputs:
      deploy_debug:
        description: tatsunote2 の debug 環境へデプロイする(runner が必要)
        type: boolean
        default: false

env:
  GHCR_BASE: ghcr.io/c-lab-works/rsai-backend

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── GitHub-hosted runner でテスト & ビルド & GHCR push (GCP 不使用)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: ./gradlew :gate-core:test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: |
            gate-core/build/reports/tests/
            gate-core/build/test-results/
          if-no-files-found: warn
          retention-days: 90

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push to GHCR
        run: |
          set -o pipefail
          TAG_NAMES=("${GITHUB_SHA}")
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            TAG_NAMES+=(latest)
          elif [ "$GITHUB_REF_NAME" = "debug" ]; then
            TAG_NAMES+=(debug)
          fi
          printf '%s\n' "${TAG_NAMES[@]}" > tags.txt
          TAG_ARGS=()
          for t in "${TAG_NAMES[@]}"; do TAG_ARGS+=(-t "${GHCR_BASE}:${t}"); done
          docker buildx build . \
            "${TAG_ARGS[@]}" \
            --cache-from "type=registry,ref=${GHCR_BASE}:buildcache" \
            --cache-to "type=registry,ref=${GHCR_BASE}:buildcache,mode=max" \
            --metadata-file metadata.json \
            --push --progress=plain 2>&1 | tee build.log

      - name: Extract binary and build info
        run: |
          set -euo pipefail
          mkdir -p artifact
          jq -r '."containerimage.digest"' metadata.json > artifact/image-digest.txt
          CID="$(docker create "${GHCR_BASE}:${GITHUB_SHA}")"
          docker cp "${CID}:/app/app" artifact/rsai-backend
          docker rm "$CID" > /dev/null
          (cd artifact && sha256sum rsai-backend > sha256sum.txt)
          grep -a -o -m1 'JDK 25\.[0-9.]*+[0-9]*' artifact/rsai-backend > artifact/jdk-version.txt || echo unknown > artifact/jdk-version.txt
          cp tags.txt artifact/tags.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsai-backend-${{ github.sha }}
          path: |
            artifact/
            build.log
          if-no-files-found: warn
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          read_or() { if [ -f "$1" ]; then cat "$1"; else echo "$2"; fi; }
          TESTS=0; FAILS=0; ERRS=0; SKIPS=0
          for f in gate-core/build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            TESTS=$((TESTS + $(grep -o -m1 ' tests="[0-9]*"' "$f" | tr -dc 0-9)))
            FAILS=$((FAILS + $(grep -o -m1 ' failures="[0-9]*"' "$f" | tr -dc 0-9)))
            ERRS=$((ERRS + $(grep -o -m1 ' errors="[0-9]*"' "$f" | tr -dc 0-9)))
            SKIPS=$((SKIPS + $(grep -o -m1 ' skipped="[0-9]*"' "$f" | tr -dc 0-9)))
          done
          if [ $((FAILS + ERRS)) -eq 0 ] && [ "$TESTS" -gt 0 ]; then RESULT=success; else RESULT=failure; fi
          {
            echo "## Build summary"
            echo
            echo "- イメージ digest: \`$(read_or artifact/image-digest.txt n/a)\`"
            echo "- タグ: $(read_or tags.txt n/a | paste -sd, - | sed 's/,/, /g')"
            echo "- JDK: $(read_or artifact/jdk-version.txt n/a)"
            echo "- テスト: ${TESTS} 件 (失敗 ${FAILS}, エラー ${ERRS}, スキップ ${SKIPS}) → ${RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── rsai-2026 (LXC) self-hosted runner で本番デプロイ (master only)
  # 切り替え・ヘルスチェック・失敗時の切り戻しはサーバー側の rsai-backend-deploy が行う。
  deploy-prod:
    needs: build
    if: github.ref_name == 'master'
    runs-on: [self-hosted, rsai-2026]
    timeout-minutes: 15
    permissions:
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ghcr.io/c-lab-works/rsai-backend:${{ github.sha }}

      - name: Deploy
        run: sudo -n /usr/local/sbin/rsai-backend-deploy ${{ github.sha }}

      - name: Discord通知
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS:      ${{ job.status }}
          COMMIT_SHA:      ${{ github.sha }}
          COMMIT_MSG:      ${{ github.event.head_commit.message }}
          ACTOR:           ${{ github.actor }}
          REPO:            ${{ github.repository }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ Deploy 完了  [master → rsai-2026 (prod)]"
            COLOR=2278238
          else
            TITLE="❌ Deploy 失敗  [master → rsai-2026 (prod)]"
            COLOR=15689796
          fi
          SHORT_SHA="${COMMIT_SHA:0:7}"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1 | cut -c1-72)
          PAYLOAD="$(jq -n \
            --arg title   "$TITLE" \
            --argjson color $COLOR \
            --arg sha     "\`${SHORT_SHA}\` ${FIRST_LINE}" \
            --arg actor   "$ACTOR" \
            --arg run_url "$RUN_URL" \
            --arg ts      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds:[{
              title: $title,
              color: $color,
              url: $run_url,
              fields: [
                {name:"環境",   value:"rsai-2026 (prod)",    inline:true},
                {name:"実行者", value:$actor,               inline:true},
                {name:"コミット", value:$sha,               inline:false}
              ],
              timestamp: $ts
            }]}'
          )"
          IFS=',' read -ra URLS <<< "$DISCORD_WEBHOOK"
          for URL in "${URLS[@]}"; do
            curl -sS -X POST "$URL" -H "Content-Type: application/json" -d "$PAYLOAD"
          done

  # ── tatsunote2 self-hosted runner でデプロイ (手動実行で deploy_debug 指定時のみ)
  deploy-debug:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_debug && needs.build.result == 'success'
    runs-on: [self-hosted, tatsunote2]
    timeout-minutes: 60
    permissions:
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write env file
        env:
          DEBUG_DB_PASSWORD:     ${{ secrets.DEBUG_DB_PASSWORD }}
          API_KEY:               ${{ secrets.API_KEY }}
          READ_ONLY_KEY:         ${{ secrets.READ_ONLY_KEY }}
          CF_ACCESS_AUD:         ${{ secrets.CF_ACCESS_AUD }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          ADMIN_EMAILS:          ${{ secrets.ADMIN_EMAILS }}
          CF_API_TOKEN:          ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID:            ${{ secrets.CF_ZONE_ID }}
          CF_ACCOUNT_ID:         ${{ secrets.CF_ACCOUNT_ID }}
          CF_ACCESS_POLICY_ID:   ${{ secrets.CF_ACCESS_POLICY_ID }}
          OWNER_EMAILS:          ${{ secrets.OWNER_EMAILS }}
          ORIGIN_SHARED_SECRET:  ${{ secrets.ORIGIN_SHARED_SECRET }}
          INTERNAL_SERVICE_KEY:  ${{ secrets.INTERNAL_SERVICE_KEY }}
          FORM_API_KEY:          ${{ secrets.FORM_API_KEY }}
          GH_PAT:                ${{ secrets.GH_PAT }}
          GH_SHA:                ${{ github.sha }}
          FIREBASE_PROJECT_ID:     ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
        run: |
          {
            printf 'DB_HOST=%s\n'               'rsai-mysql-debug'
            printf 'DB_PORT=%s\n'               '3306'
            printf 'DB_NAME=%s\n'               'rsai_debug'
            printf 'DB_USER=%s\n'               'root'
            printf 'DB_PASSWORD=%s\n'           "${DEBUG_DB_PASSWORD}"
            printf 'DB_SSL=%s\n'                'false'
            printf 'API_KEY=%s\n'               "${API_KEY}"
            printf 'READ_ONLY_KEY=%s\n'         "${READ_ONLY_KEY}"
            printf 'CF_ACCESS_AUD=%s\n'         "${CF_ACCESS_AUD}"
            printf 'CF_ACCESS_TEAM_DOMAIN=%s\n' "${CF_ACCESS_TEAM_DOMAIN}"
            printf 'DISCORD_WEBHOOK_URL=%s\n'   "${DISCORD_WEBHOOK_URL}"
            printf 'ADMIN_EMAILS=%s\n'          "${ADMIN_EMAILS}"
            printf 'CF_API_TOKEN=%s\n'          "${CF_API_TOKEN}"
            printf 'CF_ZONE_ID=%s\n'            "${CF_ZONE_ID}"
            printf 'CF_ACCOUNT_ID=%s\n'         "${CF_ACCOUNT_ID}"
            printf 'CF_ACCESS_POLICY_ID=%s\n'   "${CF_ACCESS_POLICY_ID}"
            printf 'OWNER_EMAILS=%s\n'          "${OWNER_EMAILS}"
            printf 'ORIGIN_SHARED_SECRET=%s\n'  "${ORIGIN_SHARED_SECRET}"
            printf 'INTERNAL_SERVICE_KEY=%s\n'  "${INTERNAL_SERVICE_KEY}"
            printf 'FORM_API_KEY=%s\n'          "${FORM_API_KEY}"
            printf 'GITHUB_PAT=%s\n'            "${GH_PAT}"
            printf 'FIREBASE_PROJECT_ID=%s\n'     "${FIREBASE_PROJECT_ID}"
            printf 'FIREBASE_PROJECT_NUMBER=%s\n' "${FIREBASE_PROJECT_NUMBER}"
            printf 'GITHUB_OWNER=C-lab-works\n'
            printf 'GITHUB_REPO=rsai-backend\n'
            printf 'GITHUB_BRANCH=debug\n'
            printf 'LOG_LEVEL=DEBUG\n'
            printf 'RUNMODE=debug\n'
            printf 'BUILD_SHA=%s\n'            "${GH_SHA}"
            printf 'APP_VERSION=%s\n'          "${GH_SHA:0:7}"
          } > /opt/rsai-debug.env
          chmod 600 /opt/rsai-debug.env

      - name: Deploy container
        env:
          DEPLOY_IMAGE: ${{ env.GHCR_BASE }}:debug
          DEBUG_DB_PASSWORD:    ${{ secrets.DEBUG_DB_PASSWORD }}
          PROD_DB_HOST:         "100.102.67.64"
          PROD_DB_PORT:         ${{ secrets.DB_PORT }}
          PROD_DB_NAME:         ${{ secrets.DB_NAME }}
          PROD_DB_USER:         ${{ secrets.DB_USER }}
          PROD_DB_PASSWORD:     ${{ secrets.DB_PASSWORD }}
          ORIGIN_SHARED_SECRET: ${{ secrets.ORIGIN_SHARED_SECRET }}
          READ_ONLY_KEY:        ${{ secrets.READ_ONLY_KEY }}
        run: |
          set -e

          # パスワードをファイルベースで管理（コマンドライン引数経由でのプロセスリスト露出を防止）
          DEBUG_CNF=$(mktemp /tmp/.mysql_debug_XXXXXX.cnf)
          PROD_CNF=$(mktemp /tmp/.mysql_prod_XXXXXX.cnf)
          MYSQL_INIT_ENV=$(mktemp /tmp/.mysql_init_env_XXXXXX)
          chmod 600 "${DEBUG_CNF}" "${PROD_CNF}" "${MYSQL_INIT_ENV}"
          printf '[client]\npassword=%s\n' "${DEBUG_DB_PASSWORD}" > "${DEBUG_CNF}"
          printf '[client]\npassword=%s\n' "${PROD_DB_PASSWORD}"  > "${PROD_CNF}"
          printf 'MYSQL_ROOT_PASSWORD=%s\nMYSQL_DATABASE=rsai_debug\n' "${DEBUG_DB_PASSWORD}" > "${MYSQL_INIT_ENV}"
          trap 'rm -f "${DEBUG_CNF}" "${PROD_CNF}" "${MYSQL_INIT_ENV}"' EXIT

          echo '=== Ensuring Docker network ==='
          docker network create rsai-debug-net 2>/dev/null || true

          echo '=== Ensuring MySQL container ==='
          if ! docker ps --format '{{.Names}}' | grep -q '^rsai-mysql-debug$'; then
            docker rm -f rsai-mysql-debug 2>/dev/null || true
            docker pull mirror.gcr.io/library/mysql:8.0
            docker tag mirror.gcr.io/library/mysql:8.0 mysql:8.0
            docker run -d \
              --name rsai-mysql-debug \
              --network rsai-debug-net \
              --restart unless-stopped \
              --env-file "${MYSQL_INIT_ENV}" \
              -v rsai-mysql-debug-data:/var/lib/mysql \
              mysql:8.0
            echo 'Waiting for MySQL to be ready...'
            docker cp "${DEBUG_CNF}" rsai-mysql-debug:/root/.my_debug.cnf
            docker exec rsai-mysql-debug chmod 600 /root/.my_debug.cnf
            for i in $(seq 1 30); do
              docker exec rsai-mysql-debug mysqladmin --defaults-extra-file=/root/.my_debug.cnf ping -uroot --silent 2>/dev/null && echo 'MySQL ready' && break || true
              sleep 3
            done
          else
            echo 'MySQL already running, ensuring network membership...'
            docker network connect rsai-debug-net rsai-mysql-debug 2>/dev/null || true
            docker cp "${DEBUG_CNF}" rsai-mysql-debug:/root/.my_debug.cnf
            docker exec rsai-mysql-debug chmod 600 /root/.my_debug.cnf
            docker exec rsai-mysql-debug mysqladmin --defaults-extra-file=/root/.my_debug.cnf ping -uroot --silent 2>/dev/null && echo 'MySQL ping OK' || echo 'WARNING: MySQL ping failed'
          fi

          echo '=== Syncing prod DB → debug DB ==='
          echo "[sync] Resetting rsai_debug..."
          docker exec rsai-mysql-debug \
            mysql --defaults-extra-file=/root/.my_debug.cnf -uroot -v \
            -e "DROP DATABASE IF EXISTS rsai_debug; CREATE DATABASE rsai_debug;" \
            && echo "[sync] DB reset OK" || { echo "[sync] ERROR: DB reset failed"; exit 1; }

          DUMP_FILE="/tmp/prod_dump_$$.sql"
          echo "[sync] Dumping from ${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}..."
          docker run --rm \
            -v "${PROD_CNF}:/tmp/.my_prod.cnf:ro" \
            mysql:8.0 \
            mysqldump \
              --defaults-extra-file=/tmp/.my_prod.cnf \
              -h "${PROD_DB_HOST}" -P "${PROD_DB_PORT}" \
              -u "${PROD_DB_USER}" \
              --single-transaction --quick --skip-lock-tables \
              --no-tablespaces \
              --ignore-table="${PROD_DB_NAME}.metrics_hourly" \
              "${PROD_DB_NAME}" \
            > "${DUMP_FILE}" 2>/tmp/dump_stderr_$$
          DUMP_EXIT=$?
          cat /tmp/dump_stderr_$$ || true
          if [ "$DUMP_EXIT" -ne 0 ]; then
            echo "[sync] ERROR: mysqldump failed (exit=${DUMP_EXIT})"
            rm -f "${DUMP_FILE}" /tmp/dump_stderr_$$
            exit 1
          fi
          DUMP_SIZE=$(wc -c < "${DUMP_FILE}")
          echo "[sync] Dump OK: ${DUMP_SIZE} bytes"

          echo "[sync] Importing into rsai_debug..."
          docker exec -i rsai-mysql-debug \
            mysql --defaults-extra-file=/root/.my_debug.cnf -uroot rsai_debug < "${DUMP_FILE}"
          IMPORT_EXIT=$?
          rm -f "${DUMP_FILE}" /tmp/dump_stderr_$$
          if [ "$IMPORT_EXIT" -eq 0 ]; then
            echo "[sync] SUCCESS: prod → rsai_debug sync complete"
            TABLE_COUNT=$(docker exec rsai-mysql-debug \
              mysql --defaults-extra-file=/root/.my_debug.cnf -uroot -sN \
              -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='rsai_debug';")
            echo "[sync] Tables restored: ${TABLE_COUNT}"
          else
            echo "[sync] ERROR: import failed (exit=${IMPORT_EXIT})"
            exit 1
          fi

          echo '=== Pulling image ==='
          docker pull "${DEPLOY_IMAGE}"

          echo '=== Stopping existing container ==='
          docker stop rsai-debug 2>/dev/null || true
          docker rm   rsai-debug 2>/dev/null || true

          echo '=== Waiting 1s for DB to settle ==='
          sleep 1

          echo '=== Starting container ==='
          docker run -d \
            --name rsai-debug \
            --network rsai-debug-net \
            --restart unless-stopped \
            --env-file /opt/rsai-debug.env \
            -p 8082:8080 \
            --cpus=10 \
            --memory=6g \
            --health-cmd='curl -sf http://localhost:8080/health || exit 1' \
            --health-interval=5s \
            --health-timeout=5s \
            --health-retries=12 \
            --health-start-period=10s \
            "${DEPLOY_IMAGE}"

          echo '=== Health check ==='
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/health 2>/dev/null || echo '000')
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              docker ps --filter name=rsai-debug
              break
            fi
            echo "Attempt $i/20: HTTP $STATUS, waiting..."
            sleep 5
          done
          if [ "$STATUS" != "200" ]; then
            echo '=== Health check failed. Diagnostics: ==='
            echo '--- Container status ---'
            docker ps -a --filter name=rsai-debug
            echo '--- Network membership ---'
            docker network inspect rsai-debug-net --format '{{range .Containers}}{{.Name}} {{end}}'
            echo '--- MySQL ping ---'
            docker exec rsai-mysql-debug mysqladmin --defaults-extra-file=/root/.my_debug.cnf ping -uroot --silent 2>&1 || true
            echo '--- App logs (last 80 lines) ---'
            docker logs --tail 80 rsai-debug
            exit 1
          fi

          echo '=== Endpoint smoke test ==='
          FAIL=0
          for path in /events /food /map /announcements /api/locations /api/categories /api/projects /api/credit /api/bus; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "X-Origin-Secret: ${ORIGIN_SHARED_SECRET}" \
              -H "X-Api-Key: ${READ_ONLY_KEY}" \
              "http://localhost:8082${path}" 2>/dev/null || echo '000')
            if [ "$CODE" = "200" ]; then
              echo "[OK]   ${path} -> ${CODE}"
            else
              echo "[FAIL] ${path} -> ${CODE}"
              FAIL=1
            fi
          done
          if [ "$FAIL" != "0" ]; then
            echo '--- App logs (last 40 lines) ---'
            docker logs --tail 40 rsai-debug
            exit 1
          fi
          echo 'All endpoints OK'

          echo '=== Pruning unused images ==='
          docker image prune -f

      - name: Verify /admin/stars/ranking (debug investigation)
        if: always()
        env:
          API_KEY:              ${{ secrets.API_KEY }}
          INTERNAL_SERVICE_KEY: ${{ secrets.INTERNAL_SERVICE_KEY }}
          ORIGIN_SHARED_SECRET: ${{ secrets.ORIGIN_SHARED_SECRET }}
        run: |
          echo '================ RANKING ENDPOINT TEST ================'
          OVERALL_OK=1
          for view in all hs ms foodtruck hs1 hs2 hs3 ms1 ms2 ms3; do
            RESP=$(curl -s -m 15 -w '\n%{http_code}' \
              -H "X-Origin-Secret: ${ORIGIN_SHARED_SECRET}" \
              -H "X-API-Key: ${API_KEY}" \
              -H "X-Service-Key: ${INTERNAL_SERVICE_KEY}" \
              "http://localhost:8082/admin/stars/ranking?view=${view}" 2>/dev/null || printf '\n000')
            CODE=$(printf '%s' "$RESP" | tail -n1)
            BODY=$(printf '%s' "$RESP" | sed '$d' | head -c 180)
            echo "[view=${view}] HTTP=${CODE}  body=${BODY}"
            [ "$CODE" = "200" ] || OVERALL_OK=0
          done
          echo "RANKING_ENDPOINT_ALL_200=${OVERALL_OK}"
          echo '================ SQL ROOT-CAUSE CHECK ================='
          DBX() { docker exec rsai-mysql-debug mysql --defaults-extra-file=/root/.my_debug.cnf -uroot rsai_debug "$@"; }
          echo '--- (A) ORIGINAL count-alias query (commit 6dde7b8) ---'
          if DBX -e "SELECT 'project' AS type, id, title AS name, organizer, bookmark_count AS count FROM projects UNION ALL SELECT 'foodtruck', id, name, NULL, bookmark_count FROM foodtruck ORDER BY count DESC LIMIT 5;" 2>&1; then
            echo "RESULT_A_COUNT_ALIAS=OK"
          else
            echo "RESULT_A_COUNT_ALIAS=ERROR"
          fi
          echo '--- (B) CURRENT star_count query (HEAD) ---'
          if DBX -e "SELECT 'project' AS type, id, title AS name, organizer, bookmark_count AS star_count FROM projects UNION ALL SELECT 'foodtruck' AS type, id, name AS name, NULL AS organizer, bookmark_count AS star_count FROM foodtruck ORDER BY star_count DESC LIMIT 5;" 2>&1; then
            echo "RESULT_B_STAR_COUNT=OK"
          else
            echo "RESULT_B_STAR_COUNT=ERROR"
          fi
          echo '======================================================'

      - name: Discord通知
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS:      ${{ job.status }}
          COMMIT_SHA:      ${{ github.sha }}
          COMMIT_MSG:      ${{ github.event.head_commit.message }}
          ACTOR:           ${{ github.actor }}
          REPO:            ${{ github.repository }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ Deploy 完了  [debug → tatsunote2]"
            COLOR=2278238
          else
            TITLE="❌ Deploy 失敗  [debug → tatsunote2]"
            COLOR=15689796
          fi
          SHORT_SHA="${COMMIT_SHA:0:7}"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1 | cut -c1-72)
          PAYLOAD="$(jq -n \
            --arg title   "$TITLE" \
            --argjson color $COLOR \
            --arg sha     "\`${SHORT_SHA}\` ${FIRST_LINE}" \
            --arg actor   "$ACTOR" \
            --arg run_url "$RUN_URL" \
            --arg ts      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds:[{
              title: $title,
              color: $color,
              url: $run_url,
              fields: [
                {name:"環境",   value:"tatsunote2 (debug)", inline:true},
                {name:"実行者", value:$actor,               inline:true},
                {name:"コミット", value:$sha,               inline:false}
              ],
              timestamp: $ts
            }]}'
          )"
          IFS=',' read -ra URLS <<< "$DISCORD_WEBHOOK"
          for URL in "${URLS[@]}"; do
            curl -sS -X POST "$URL" -H "Content-Type: application/json" -d "$PAYLOAD"
          done

  # ── masterをdebugブランチに同期+skip ci でactions回避
  sync-debug:
    needs: [build]
    if: github.ref_name == 'master' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: debug
          token: ${{ secrets.GH_PAT }}

      - name: Merge master into debug and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          # すでにdebugがmasterを含んでいれば（同期不要）何もしない
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "debug already contains master. Nothing to sync."
            exit 0
          fi
          git merge origin/master --no-ff --no-edit \
            -m "Merge branch 'master' into debug [skip ci]"
          git push origin HEAD:debug
