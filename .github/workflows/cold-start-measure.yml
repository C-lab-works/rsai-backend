name: Measure Cold Start

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: rsai-backend
  SERVICE_URL: https://rsai-backend-owe3trpwtq-an.a.run.app

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch recent Cloud Run logs
        run: |
          REVISION=$(gcloud run revisions list \
            --service="${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --format="value(metadata.name)" \
            --limit=1)
          echo "=== Recent logs for revision: $REVISION ==="
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ env.SERVICE_NAME }}\" AND resource.labels.revision_name=\"$REVISION\" AND severity>=WARNING" \
            --project="${{ env.PROJECT_ID }}" \
            --limit=50 \
            --order=desc \
            --format="table(timestamp,textPayload,jsonPayload.message)" 2>&1 || true
