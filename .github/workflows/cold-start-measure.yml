name: Measure Cold Start

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: rsai-backend
  SERVICE_URL: https://rsai-backend-owe3trpwtq-an.a.run.app

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch recent Cloud Run logs
        run: |
          echo "=== Recent Cloud Run logs ==="
          gcloud beta run services logs read ${{ env.SERVICE_NAME }} \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --limit=50 2>&1 || true
