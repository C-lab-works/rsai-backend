name: Measure Cold Start

on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: rsai-backend
  SERVICE_URL: https://rsai-backend-owe3trpwtq-an.a.run.app

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Measure cold start
        run: |
          echo "=== Cold Start Measurement ==="
          echo "Endpoint: ${{ env.SERVICE_URL }}/health"
          echo ""
          for i in 1 2 3; do
            echo "--- Trial $i ---"
            curl -s -o /dev/null \
              -w "HTTP %{http_code}  total=%{time_total}s  connect=%{time_connect}s  ttfb=%{time_starttransfer}s\n" \
              "${{ env.SERVICE_URL }}/health"
            sleep 2
          done
