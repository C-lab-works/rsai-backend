name: Deploy to Cloud Run

on:
  push:
    branches: [master]

concurrency:
  group: spot-vm-runner
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE_NAME: rsai-backend
  REPOSITORY: rsai-backend
  MIN_SCALE: ${{ vars.MIN_SCALE }}
  RUNNER_VM: github-runner
  RUNNER_ZONE: asia-northeast1-a

jobs:
  # ── Spot VMを起動してrunnerがオンラインになるまで待機
  start-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Start VM
        run: |
          gcloud compute instances start ${{ env.RUNNER_VM }} \
            --zone=${{ env.RUNNER_ZONE }} \
            --project="${{ env.PROJECT_ID }}"

      - name: Wait for runner to be online
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_RUNNERS }}
        run: |
          echo "Waiting for self-hosted runner to come online..."
          for i in $(seq 1 30); do
            STATUS=$(gh api "repos/${{ github.repository }}/actions/runners" \
              --jq '.runners[] | select(.name == "${{ env.RUNNER_VM }}") | .status' 2>/dev/null || echo "")
            if [ "$STATUS" = "online" ]; then
              echo "Runner is online (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30: status='$STATUS', retrying in 10s..."
            sleep 10
          done
          echo "Runner did not come online within 5 minutes"
          exit 1

  # ── Spot VMでの高速ビルド
  deploy-fast:
    needs: start-runner
    if: needs.start-runner.result == 'success'
    runs-on: [self-hosted, spot]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate version.txt
        run: |
          BASE=$(grep '^version=' gate-core/src/main/resources/version.txt | cut -d'=' -f2 | tr -d '[:space:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${BASE}-${SHORT_SHA}" > gate-core/src/main/resources/version.txt

      - name: Build and push to Artifact Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:buildcache,mode=max

      - name: Generate Cloud Run service YAML
        run: |
          cat > service.yaml <<EOF
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: ${{ env.SERVICE_NAME }}
            labels:
              cloud.googleapis.com/location: ${{ env.REGION }}
            annotations:
              run.googleapis.com/ingress: all
              run.googleapis.com/default-url-disabled: "true"
          spec:
            template:
              metadata:
                annotations:
                  autoscaling.knative.dev/minScale: "${{ env.MIN_SCALE }}"
                  autoscaling.knative.dev/maxScale: "30"
                  run.googleapis.com/cpu-throttling: "false"
                  run.googleapis.com/startup-cpu-boost: "true"
                  run.googleapis.com/execution-environment: gen2
              spec:
                containerConcurrency: 300
                timeoutSeconds: 60
                containers:
                  - name: app
                    image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
                    ports:
                      - name: http1
                        containerPort: 8080
                    resources:
                      limits:
                        cpu: "2"
                        memory: 2Gi
                    startupProbe:
                      httpGet:
                        path: /health
                      initialDelaySeconds: 3
                      periodSeconds: 5
                      failureThreshold: 60
                      timeoutSeconds: 5
                    env:
                      - name: DB_HOST
                        value: "${{ secrets.DB_HOST }}"
                      - name: DB_PORT
                        value: "${{ secrets.DB_PORT }}"
                      - name: DB_NAME
                        value: "${{ secrets.DB_NAME }}"
                      - name: DB_USER
                        value: "${{ secrets.DB_USER }}"
                      - name: DB_PASSWORD
                        value: "${{ secrets.DB_PASSWORD }}"
                      - name: DB_SSL
                        value: "${{ secrets.DB_SSL }}"
                      - name: API_KEY
                        value: "${{ secrets.API_KEY }}"
                      - name: READ_ONLY_KEY
                        value: "${{ secrets.READ_ONLY_KEY }}"
                      - name: CF_ACCESS_AUD
                        value: "${{ secrets.CF_ACCESS_AUD }}"
                      - name: CF_ACCESS_TEAM_DOMAIN
                        value: "${{ secrets.CF_ACCESS_TEAM_DOMAIN }}"
                      - name: DISCORD_WEBHOOK_URL
                        value: "${{ secrets.DISCORD_WEBHOOK_URL }}"
                      - name: ADMIN_EMAILS
                        value: "${{ secrets.ADMIN_EMAILS }}"
                      - name: LOG_LEVEL
                        value: "${{ vars.LOG_LEVEL || 'INFO' }}"
                      - name: CF_API_TOKEN
                        value: "${{ secrets.CF_API_TOKEN }}"
                      - name: CF_ZONE_ID
                        value: "${{ secrets.CF_ZONE_ID }}"
                      - name: RUNMODE
                        value: "cloudrun"
                      - name: GITHUB_PAT
                        value: "${{ secrets.GH_PAT }}"
                      - name: GITHUB_OWNER
                        value: "${{ vars.GH_OWNER }}"
                      - name: GITHUB_REPO
                        value: "${{ vars.GH_REPO }}"
                      - name: GITHUB_BRANCH
                        value: "${{ vars.GH_BRANCH }}"
                      - name: GITHUB_YAML_PATH
                        value: "${{ vars.GH_YAML_PATH }}"
                      - name: GITHUB_WORKFLOW_FILE
                        value: "${{ vars.GH_WORKFLOW_FILE }}"
                      - name: ORIGIN_SHARED_SECRET
                        value: "${{ secrets.ORIGIN_SHARED_SECRET }}"

          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace service.yaml \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --member=allUsers \
            --role=roles/run.invoker
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-latest \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"

      - name: Fetch Cloud Run logs on failure
        if: failure()
        continue-on-error: true
        run: |
          REVISION=$(gcloud run revisions list \
            --service="${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --format="value(metadata.name)" \
            --limit=1)
          echo "=== Logs for revision: $REVISION ==="
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ env.SERVICE_NAME }}\" AND resource.labels.revision_name=\"$REVISION\"" \
            --project="${{ env.PROJECT_ID }}" \
            --limit=100 \
            --order=asc \
            --format="table(timestamp,textPayload)" 2>&1 || true

      # deploy-fast 失敗時に buildcache タグを削除し、
      # fallback がクリーンなキャッシュで再ビルドできるようにする。
      - name: Purge stale buildcache on failure
        if: failure()
        continue-on-error: true
        run: |
          gcloud artifacts docker tags delete \
            "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:buildcache" \
            --project="${{ env.PROJECT_ID }}" \
            --quiet 2>/dev/null || true
          echo "buildcache tag purged (or did not exist)"

  # ── Spot VM失敗時のGitHub-hostedフォールバック
  deploy-fallback:
    needs: [start-runner, deploy-fast]
    if: always() && (needs.start-runner.result == 'failure' || contains(fromJSON('["failure","cancelled"]'), needs.deploy-fast.result))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate version.txt
        run: |
          BASE=$(grep '^version=' gate-core/src/main/resources/version.txt | cut -d'=' -f2 | tr -d '[:space:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${BASE}-${SHORT_SHA}" > gate-core/src/main/resources/version.txt

      - name: Build and push to Artifact Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Generate Cloud Run service YAML
        run: |
          cat > service.yaml <<EOF
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: ${{ env.SERVICE_NAME }}
            labels:
              cloud.googleapis.com/location: ${{ env.REGION }}
            annotations:
              run.googleapis.com/ingress: all
              run.googleapis.com/default-url-disabled: "true"
          spec:
            template:
              metadata:
                annotations:
                  autoscaling.knative.dev/minScale: "${{ env.MIN_SCALE }}"
                  autoscaling.knative.dev/maxScale: "30"
                  run.googleapis.com/cpu-throttling: "false"
                  run.googleapis.com/startup-cpu-boost: "true"
                  run.googleapis.com/execution-environment: gen2
              spec:
                containerConcurrency: 300
                timeoutSeconds: 60
                containers:
                  - name: app
                    image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
                    ports:
                      - name: http1
                        containerPort: 8080
                    resources:
                      limits:
                        cpu: "2"
                        memory: 2Gi
                    startupProbe:
                      httpGet:
                        path: /health
                      initialDelaySeconds: 3
                      periodSeconds: 5
                      failureThreshold: 60
                      timeoutSeconds: 5
                    env:
                      - name: DB_HOST
                        value: "${{ secrets.DB_HOST }}"
                      - name: DB_PORT
                        value: "${{ secrets.DB_PORT }}"
                      - name: DB_NAME
                        value: "${{ secrets.DB_NAME }}"
                      - name: DB_USER
                        value: "${{ secrets.DB_USER }}"
                      - name: DB_PASSWORD
                        value: "${{ secrets.DB_PASSWORD }}"
                      - name: DB_SSL
                        value: "${{ secrets.DB_SSL }}"
                      - name: API_KEY
                        value: "${{ secrets.API_KEY }}"
                      - name: READ_ONLY_KEY
                        value: "${{ secrets.READ_ONLY_KEY }}"
                      - name: CF_ACCESS_AUD
                        value: "${{ secrets.CF_ACCESS_AUD }}"
                      - name: CF_ACCESS_TEAM_DOMAIN
                        value: "${{ secrets.CF_ACCESS_TEAM_DOMAIN }}"
                      - name: DISCORD_WEBHOOK_URL
                        value: "${{ secrets.DISCORD_WEBHOOK_URL }}"
                      - name: ADMIN_EMAILS
                        value: "${{ secrets.ADMIN_EMAILS }}"
                      - name: LOG_LEVEL
                        value: "${{ vars.LOG_LEVEL || 'INFO' }}"
                      - name: CF_API_TOKEN
                        value: "${{ secrets.CF_API_TOKEN }}"
                      - name: CF_ZONE_ID
                        value: "${{ secrets.CF_ZONE_ID }}"
                      - name: RUNMODE
                        value: "cloudrun"
                      - name: GITHUB_PAT
                        value: "${{ secrets.GH_PAT }}"
                      - name: GITHUB_OWNER
                        value: "${{ vars.GH_OWNER }}"
                      - name: GITHUB_REPO
                        value: "${{ vars.GH_REPO }}"
                      - name: GITHUB_BRANCH
                        value: "${{ vars.GH_BRANCH }}"
                      - name: GITHUB_YAML_PATH
                        value: "${{ vars.GH_YAML_PATH }}"
                      - name: GITHUB_WORKFLOW_FILE
                        value: "${{ vars.GH_WORKFLOW_FILE }}"
                      - name: ORIGIN_SHARED_SECRET
                        value: "${{ secrets.ORIGIN_SHARED_SECRET }}"

          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run services replace service.yaml \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --member=allUsers \
            --role=roles/run.invoker
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-latest \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"

