# Cloud Run service definition (reference / manual deploy)
# Usage: substitute placeholders then run:
#   gcloud run services replace cloudrun.yaml --region=REGION
#
# Placeholders:
#   PROJECT_ID      : GCP project ID
#   REGION          : e.g. asia-northeast1
#   CLOUD_SQL_INSTANCE : project:region:instance  (shown in Cloud SQL console)

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rsai-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Cloud SQL Unix-socket connection
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "0"
    spec:
      containerConcurrency: 300
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/rsai-backend/rsai-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: CLOUD_SQL_INSTANCE
              value: PROJECT_ID:REGION:INSTANCE_NAME
            - name: DB_NAME
              value: rsai
            - name: DB_USER
              value: rsai
            - name: DB_PASSWORD
              # Prefer Secret Manager: replace with secretKeyRef once configured
              value: REPLACE_ME
            - name: CORS_ALLOWED_ORIGIN
              value: https://admin.r-sai2026.site
          startupProbe:
            httpGet:
              path: /health
            # /health はアプリケーション起動直後から 503 を返せるため、
            # 7 秒も待たずにプローブを始めてキャイッチアップを早める。
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "2"
              # GC ヘッドルーム確保とピーク負荷時の安定性のため 1Gi → 2Gi に拡張。
              # -R:MaxHeapSize=1536m と合わせて1Gi のストレスを転げる。
              memory: 2Gi
